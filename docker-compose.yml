services:
  backend:
    image: 820140266353.dkr.ecr.ap-south-1.amazonaws.com/personal-pdf-chatbot-backend:v1
    container_name: pdf-chatbot-backend
    env_file:
      - .env
    environment:
      HF_HOME: /models
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data/uploads:/app/data/uploads
      - model_cache:/models
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: 820140266353.dkr.ecr.ap-south-1.amazonaws.com/personal-pdf-chatbot-frontend:v1
    container_name: pdf-chatbot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_cache:
